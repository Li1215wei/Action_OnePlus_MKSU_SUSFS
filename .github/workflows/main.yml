- name: Find and export uclamp source files
  run: |
    cd kernel_workspace/kernel_platform

    # 创建输出目录
    mkdir -p /tmp/uclamp_src

    echo "=== Searching for uclamp related source files in msm-kernel ==="
    # 在 msm-kernel 下搜索所有包含 "uclamp" 的 .c 和 .h 文件
    find ./msm-kernel -type f \( -name "*.c" -o -name "*.h" \) -exec grep -l "uclamp" {} \; 2>/dev/null > /tmp/uclamp_files_list.txt

    # 如果 msm-kernel 没找到，在 common 下搜索
    if [ ! -s /tmp/uclamp_files_list.txt ]; then
      echo "No uclamp files found in msm-kernel, searching in common..."
      find ./common -type f \( -name "*.c" -o -name "*.h" \) -exec grep -l "uclamp" {} \; 2>/dev/null > /tmp/uclamp_files_list.txt
    fi

    # 显示找到的文件列表
    echo "=== Files found ==="
    cat /tmp/uclamp_files_list.txt
    echo ""

    # 复制找到的文件到输出目录
    while IFS= read -r file; do
      if [ -f "$file" ]; then
        target_dir="/tmp/uclamp_src/$(dirname "$file")"
        mkdir -p "$target_dir"
        cp "$file" "$target_dir/"
        echo "Copied: $file"
      fi
    done < /tmp/uclamp_files_list.txt

    # 如果还是没有找到任何文件，输出诊断信息
    if [ ! -s /tmp/uclamp_files_list.txt ]; then
      echo "ERROR: No uclamp source files found in msm-kernel or common!" > /tmp/uclamp_src/NO_UCLAMP_FILES.txt
      echo "Searching for sched directory structure..." >> /tmp/uclamp_src/NO_UCLAMP_FILES.txt
      find ./msm-kernel -type d -name sched >> /tmp/uclamp_src/NO_UCLAMP_FILES.txt 2>/dev/null || echo "No sched dir found" >> /tmp/uclamp_src/NO_UCLAMP_FILES.txt
    fi

    # 生成汇总报告
    {
      echo "=== UCLAMP SOURCE FILES SUMMARY ==="
      echo "Total files found: $(wc -l < /tmp/uclamp_files_list.txt 2>/dev/null || echo 0)"
      echo ""
      echo "=== File list ==="
      cat /tmp/uclamp_files_list.txt 2>/dev/null || echo "No files found"
      echo ""
      echo "=== Directory structure of extracted files ==="
      cd /tmp/uclamp_src
      find . -type f | sort 2>/dev/null || echo "No files extracted"
    } > /tmp/uclamp_src/SUMMARY.txt
