name: Analyze Wild Kernel Image
on:
  workflow_dispatch:
    inputs:
      IMAGE_URL:https://release-assets.githubusercontent.com/github-production-release-asset/1334993557/77bf540e-5fe2-41f3-9b2c-19ea13509fd5?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-16T05%3A57%3A12Z&rscd=attachment%3B+filename%3DImage&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-16T04%3A56%3A15Z&ske=2026-08-16T05%3A57%3A12Z&sks=b&skv=2018-11-09&sig=hasKwFu3HcJG7w3XcJ4SbbOyohaThoChZzHFuNlZyIQ%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4Njg1ODc2OSwibmJmIjoxNzg2ODU2OTY5LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.q9M_M3WzYs7LVhR5gLNTGfbO7Jwk_5Ab33XeEJYEnro&response-content-disposition=attachment%3B%20filename%3DImage&response-content-type=application%2Foctet-stream
        description: '大佬Image文件的直链下载地址'
        required: true
        default: 'https://your-storage.com/Image'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y binutils curl

      - name: Download wild Image
        run: |
          curl -L "${{ github.event.inputs.IMAGE_URL }}" -o /tmp/wild_Image
          file /tmp/wild_Image
          ls -lh /tmp/wild_Image

      - name: Extract uclamp symbols
        run: |
          echo "=== uclamp symbols from nm ===" > /tmp/uclamp_report.txt
          nm /tmp/wild_Image 2>/dev/null | grep -i uclamp >> /tmp/uclamp_report.txt || echo "No uclamp symbols found by nm" >> /tmp/uclamp_report.txt
          echo "" >> /tmp/uclamp_report.txt
          echo "=== uclamp strings ===" >> /tmp/uclamp_report.txt
          strings /tmp/wild_Image | grep -i uclamp >> /tmp/uclamp_report.txt || echo "No uclamp strings" >> /tmp/uclamp_report.txt
          echo "" >> /tmp/uclamp_report.txt
          echo "=== sched related strings (head 30) ===" >> /tmp/uclamp_report.txt
          strings /tmp/wild_Image | grep -i "sched" | head -30 >> /tmp/uclamp_report.txt

      - name: Upload analysis result
        uses: actions/upload-artifact@v4
        with:
          name: wild_kernel_analysis
          path: /tmp/uclamp_report.txt
