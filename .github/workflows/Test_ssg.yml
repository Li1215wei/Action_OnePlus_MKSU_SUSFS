name: Test SSG移植 (快速验证)
on:
  workflow_dispatch:

jobs:
  test-ssg:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化存储空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git curl python3

      - name: 安装 repo 工具
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 拉取内核源码
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/${{ github.repository }}.git -b main -m oneplus_ace_pro_v.xml --depth=1
          repo sync

      - name: 执行 SSG 移植脚本 (使用仓库根目录的 add_ssg.sh)
        run: |
          chmod +x $GITHUB_WORKSPACE/add_ssg.sh
          cd kernel_workspace/kernel_platform
          $GITHUB_WORKSPACE/add_ssg.sh

      - name: 验证 SSG 文件
        run: |
          echo "=== msm-kernel/block/ssg-* ==="
          ls -la kernel_workspace/kernel_platform/msm-kernel/block/ssg-* 2>/dev/null || echo "❌ 未找到 ssg 文件"
          echo "=== common/block/ssg-* ==="
          ls -la kernel_workspace/kernel_platform/common/block/ssg-* 2>/dev/null || echo "❌ 未找到 ssg 文件"
          echo "=== Makefile 是否包含 ssg ==="
          grep -q "ssg-" kernel_workspace/kernel_platform/msm-kernel/block/Makefile && echo "✅ msm Makefile 已修改" || echo "❌ msm Makefile 未修改"
          grep -q "ssg-" kernel_workspace/kernel_platform/common/block/Makefile && echo "✅ common Makefile 已修改" || echo "❌ common Makefile 未修改"
