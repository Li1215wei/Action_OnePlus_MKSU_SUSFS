- name: 从 Release 下载 Image 文件
  run: |
    # 先用 wget 试一次，并显示详细输出
    wget --verbose https://github.com/Li1215wei/Action_OnePlus_MKSU_SUSFS/releases/download/v0.1-image/Image -O Image
    # 检查文件是否下载成功
    if [ ! -f ./Image ]; then
      echo "下载失败，尝试用 curl 再次下载"
      curl -L -H "Accept: application/octet-stream" \
        https://github.com/Li1215wei/Action_OnePlus_MKSU_SUSFS/releases/download/v0.1-image/Image \
        -o Image
    fi
    # 列出当前目录文件，确认文件已存在
    ls -la
