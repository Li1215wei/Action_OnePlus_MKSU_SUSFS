name: Explore Kernel Source Structure
on:
  workflow_dispatch:
    inputs:
      CPU:
        type: choice
        description: "分支"
        required: true
        default: sm8475
        options:
          - sm8475
          - sm8550
          - sm8650
      FEIL:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace_pro_v
        options:
          - oneplus_ace_pro_v
          - oneplus_ace2_pro_v
          - oneplus_11_v
      CPUD:
        type: choice
        description: "处理器代号"
        required: true
        default: waipio
        options:
          - waipio
          - kalama
          - pineapple

jobs:
  explore:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl tree

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/${{ github.repository }}.git -b main -m oneplus_ace_pro_v.xml --depth=1
          repo sync
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      - name: Generate directory tree
        run: |
          cd kernel_workspace/kernel_platform
          tree -L 3 -d > /tmp/dirtree.txt
          echo "=== Kernel Platform Directory Structure ===" >> /tmp/dirtree.txt
          echo "" >> /tmp/dirtree.txt
          tree -L 3 -d >> /tmp/dirtree.txt
          echo "" >> /tmp/dirtree.txt
          echo "=== block directory location ===" >> /tmp/dirtree.txt
          find . -type d -name block >> /tmp/dirtree.txt
          echo "" >> /tmp/dirtree.txt
          echo "=== drivers/cpufreq location ===" >> /tmp/dirtree.txt
          find . -type d -name cpufreq >> /tmp/dirtree.txt
          echo "" >> /tmp/dirtree.txt
          echo "=== drivers/cpu_input_boost location ===" >> /tmp/dirtree.txt
          find . -type d -name cpu_input_boost >> /tmp/dirtree.txt

      - name: Upload source structure artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_source_structure
          path: |
            kernel_workspace/kernel_platform
            /tmp/dirtree.txt
