name: Test SSG移植 (补丁方式)
on:
  workflow_dispatch:

jobs:
  test-ssg:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git curl python3

      - name: 安装 repo
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 拉取内核源码
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/${{ github.repository }}.git -b main -m oneplus_ace_pro_v.xml --depth=1
          repo sync

      - name: 应用 SSG 补丁
        run: |
          cd kernel_workspace/kernel_platform
          PATCH_FILE=$GITHUB_WORKSPACE/patches/0001-add-ssg-io-scheduler.patch
          if [ -f "$PATCH_FILE" ]; then
            echo "找到补丁文件，正在应用..."
            patch -p1 < "$PATCH_FILE"
            echo "补丁已应用"
          else
            echo "补丁文件不存在: $PATCH_FILE"
            exit 1
          fi

      - name: 验证补丁是否生效
        run: |
          cd kernel_workspace/kernel_platform
          echo "=== 检查 Makefile ==="
          grep -q "ssg-" block/Makefile && echo "✅ Makefile 已修改" || echo "❌ Makefile 未修改"
          echo "=== 检查 Kconfig ==="
          grep -q "MQ_IOSCHED_SSG" block/Kconfig && echo "✅ Kconfig 已修改" || echo "❌ Kconfig 未修改"
          echo "=== 检查 SSG 源文件 ==="
          ls -la block/ssg-* 2>/dev/null && echo "✅ SSG 源文件已添加" || echo "❌ SSG 源文件未找到"
