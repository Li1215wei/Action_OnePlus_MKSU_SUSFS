name: Export OKI uclamp source files
on:
  workflow_dispatch:

jobs:
  export-uclamp:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/${{ github.repository }}.git -b main -m oneplus_ace_pro_v.xml --depth=1
          repo sync
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      - name: Find and export uclamp source files
        run: |
          cd kernel_workspace/kernel_platform
          
          # 创建输出目录
          mkdir -p /tmp/uclamp_src
          
          # 查找 msm-kernel 下所有包含 "uclamp" 的源码文件
          echo "=== Searching for uclamp related source files ==="
          find ./msm-kernel -type \( -name "*.c" -o -name "*.h" \) -exec grep -l "uclamp" {} \; 2>/dev/null > /tmp/uclamp_files_list.txt
          
          # 显示找到的文件列表
          cat /tmp/uclamp_files_list.txt
          
          # 复制这些文件到输出目录（保留目录结构）
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # 创建目标目录
              target_dir="/tmp/uclamp_src/$(dirname "$file")"
              mkdir -p "$target_dir"
              # 复制文件
              cp "$file" "$target_dir/"
              echo "Copied: $file"
            fi
          done < /tmp/uclamp_files_list.txt
          
          # 如果没有找到任何文件，创建一个提示文件
          if [ ! -s /tmp/uclamp_files_list.txt ]; then
            echo "No uclamp source files found in msm-kernel!" > /tmp/uclamp_src/NO_UCLAMP_FILES.txt
            echo "Searching in common..." >> /tmp/uclamp_src/NO_UCLAMP_FILES.txt
            find ./common -type \( -name "*.c" -o -name "*.h" \) -exec grep -l "uclamp" {} \; 2>/dev/null >> /tmp/uclamp_src/NO_UCLAMP_FILES.txt
          fi
          
          # 生成一个汇总报告
          {
            echo "=== UCLAMP SOURCE FILES SUMMARY ==="
            echo "Total files found: $(wc -l < /tmp/uclamp_files_list.txt)"
            echo ""
            echo "=== File list ==="
            cat /tmp/uclamp_files_list.txt
            echo ""
            echo "=== Directory structure of extracted files ==="
            cd /tmp/uclamp_src
            find . -type f | sort
          } > /tmp/uclamp_src/SUMMARY.txt

      - name: Upload uclamp source files
        uses: actions/upload-artifact@v4
        with:
          name: oki_uclamp_sources
          path: /tmp/uclamp_src/
